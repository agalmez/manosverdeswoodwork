/* ========================= hero.jsx ========================= */
/* Hero cinematográfico con mosaico */
const { useState, useEffect, useRef } = React;

function Hero() {
  const [scrollY, setScrollY] = useState(0);
  const [mouse, setMouse] = useState({ x: 0.5, y: 0.5 });

  useEffect(() => {
    const onScroll = () => setScrollY(window.scrollY);
    const onMove = (e) => setMouse({ x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight });
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('mousemove', onMove);
    return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('mousemove', onMove); };
  }, []);

  const parallax = (depth) => `translate3d(${(mouse.x - 0.5) * depth}px, ${(mouse.y - 0.5) * depth - scrollY * (depth / 80)}px, 0)`;

  return (
    <section className="hero">
      {/* Background mosaic */}
      <div className="hero-mosaic" aria-hidden>
        <div className="hm-cell hm-1" style={{ transform: parallax(20) }}>
          <img src="img/01-mesa-ovalada-negra.png" alt="" />
        </div>
        <div className="hm-cell hm-2" style={{ transform: parallax(34) }}>
          <img src="img/06-vanity-fluted.png" alt="" />
        </div>
        <div className="hm-cell hm-3" style={{ transform: parallax(14) }}>
          <img src="img/03-mesa-centro-bloque.png" alt="" />
        </div>
        <div className="hm-cell hm-4" style={{ transform: parallax(40) }}>
          <img src="img/07-sideboard-roble.png" alt="" />
        </div>
        <div className="hm-cell hm-5" style={{ transform: parallax(24) }}>
          <img src="img/10-mesa-comedor-natural.png" alt="" />
        </div>
      </div>

      {/* Foreground content */}
      <div className="hero-content">
        <div className="hero-meta">
          <div className="mono">Taller de muebles a medida</div>
          <div className="mono">Chile · Est. 2018</div>
        </div>

        <h1 className="hero-title serif">
          <span className="line line-1">Madera que</span>
          <span className="line line-2"><em>habita</em> el</span>
          <span className="line line-3">espacio.</span>
        </h1>

        <div className="hero-bottom">
          <p className="hero-lead">
            Diseñamos y fabricamos piezas únicas — mesas, vanities, mesones y muebles de autor — para casas, restaurantes y proyectos arquitectónicos. Cada encargo nace de un boceto y termina en tu lugar.
          </p>
          <div className="hero-actions">
            <a href="#configurador" className="btn btn-solid">
              Diseña tu pieza <span className="arrow">→</span>
            </a>
            <a href="#galeria" className="btn btn-ghost">
              Ver proyectos <span className="arrow">→</span>
            </a>
          </div>
        </div>

        <div className="hero-scroll">
          <div className="mono">Scroll</div>
          <div className="scroll-line"><div className="scroll-dot" /></div>
        </div>
      </div>

      {/* Side index */}
      <div className="hero-sideindex">
        <span>01 / Madera</span>
        <span>02 / Diseño</span>
        <span>03 / A medida</span>
      </div>
    </section>
  );
}

/* Configurador interactivo — el corazón del sitio */
function Configurador() {
  const [tipo, setTipo] = useState('mesa-comedor');
  const [madera, setMadera] = useState('roble');
  const [acabado, setAcabado] = useState('natural');
  const [base, setBase] = useState('fluted');
  const [largo, setLargo] = useState(220);
  const [ancho, setAncho] = useState(100);

  const tipos = {
    'mesa-comedor':  { label: 'Mesa de comedor', tiempo: '6–8 sem', precioBase: 1450 },
    'mesa-centro':   { label: 'Mesa de centro',  tiempo: '4–5 sem', precioBase: 680  },
    'vanity':        { label: 'Vanity de baño',  tiempo: '5–7 sem', precioBase: 980  },
    'meson':         { label: 'Mesón / barra',   tiempo: '7–10 sem', precioBase: 1850 },
  };

  const maderas = {
    'roble':   { label: 'Roble americano', mult: 1.0,  color: '#C8A77A' },
    'rauli':   { label: 'Raulí nativo',     mult: 1.1,  color: '#A87752' },
    'lenga':   { label: 'Lenga clara',      mult: 0.95, color: '#D9B58A' },
    'manio':   { label: 'Mañío macizo',     mult: 1.2,  color: '#8A6A47' },
  };

  const acabados = {
    'natural':    { label: 'Natural / aceitado', filter: 'none' },
    'ennegrecido':{ label: 'Ennegrecido',         filter: 'brightness(0.18) saturate(0.4)' },
    'ahumado':    { label: 'Ahumado oscuro',      filter: 'brightness(0.55) saturate(0.7) hue-rotate(-10deg)' },
    'cera-clara': { label: 'Cera clara',          filter: 'brightness(1.12) saturate(0.85)' },
  };

  const bases = {
    'fluted':  'Fluted (estriada)',
    'bloque':  'Bloque macizo',
    'cruz':    'Cruz de madera',
    'patin':   'Patín metálico',
  };

  // precio estimado: base × área-factor × madera-mult
  const tipoData = tipos[tipo];
  const areaFactor = (largo * ancho) / (220 * 100);
  const precio = Math.round(tipoData.precioBase * areaFactor * maderas[madera].mult / 10) * 10;
  const precioMax = Math.round(precio * 1.35 / 10) * 10;

  const woodColor = maderas[madera].color;
  const acabadoFilter = acabados[acabado].filter;

    const w = 480, h = 320;

    const tableH = Math.min(80, 40 + ancho * 0.2);

.step-time { color: var(--green); padding: 4px 0; }
.proc-step p { font-size: 13px; line-height: 1.55; color: var(--ink-soft); }

@media (max-width: 820px) {
  .proc-timeline { grid-template-columns: 1fr; gap: 32px; }
  .proc-line { left: 6px; right: auto; top: 0; bottom: 0; width: 1px; height: auto; }
  .proc-step { padding-left: 32px; padding-top: 0; padding-right: 0; }
  .step-dot { left: 0; top: 6px; }
}

/* Brief */
.brief { background: var(--bone); border-top: 1px solid var(--line); }
.brief-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 80px; align-items: start; }
.brief-side h2 { margin-top: 16px; }
.brief-side h2 em { font-style: italic; color: var(--green); }
.brief-lead { margin-top: 24px; font-size: 15px; line-height: 1.6; color: var(--ink-soft); max-width: 360px; }
.brief-contact {
  margin-top: 40px;
  border-top: 1px solid var(--line);
  display: flex; flex-direction: column;
}
.bc-row {
  display: grid; grid-template-columns: 100px 1fr;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
  align-items: baseline;
  gap: 16px;
}
.bc-row .mono { color: var(--muted); }
.bc-row a:hover { color: var(--green); }

.brief-form {
  background: var(--bone-2);
  padding: 40px;
  display: flex; flex-direction: column; gap: 22px;
  border: 1px solid var(--line);
}
.brief-form label { display: flex; flex-direction: column; gap: 6px; }
.brief-form .mono { color: var(--muted); }
.brief-form input, .brief-form select, .brief-form textarea {
  padding: 14px 0;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--line-strong);
  font-family: var(--serif);
  font-size: 18px;
  color: var(--ink);
  outline: none;
  transition: border-color 0.3s ease;
}
.brief-form input:focus, .brief-form select:focus, .brief-form textarea:focus {
  border-bottom-color: var(--green);
}
.brief-form textarea { font-family: var(--sans); font-size: 14px; line-height: 1.55; resize: vertical; }
.bf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.bf-submit { align-self: flex-start; margin-top: 8px; }

.brief-success { max-width: 720px; }
.brief-success h2 em { font-style: italic; color: var(--green); }
.brief-success p { margin: 24px 0; font-size: 16px; color: var(--ink-soft); }

@media (max-width: 820px) {
  .brief-grid { grid-template-columns: 1fr; gap: 40px; }
  .bf-row { grid-template-columns: 1fr; }
  .brief-form { padding: 28px 20px; }
}
`;

function Nav() {

    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <nav className={`nav ${scrolled ? 'scrolled' : ''}`}>

  );
}

      </div>
    </div>
  );
}

function App() {
  // reveal-on-scroll
  useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) e.target.classList.add('in');
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);

  return (
    <>
      <Nav />
      <main id="top">
        <Hero />
        <MarqueeBand />
        <Manifiesto />
        <Detalle />
        <Galeria />
        <LineaTiempo />
        <Configurador />
        <Proceso />
        <Brief />
      </main>
      <Footer />

      {/* Inject all styles */}
      <style dangerouslySetInnerHTML={{ __html: heroStyles + manifiestoStyles + detalleStyles + galeriaStyles + ltStyles + cfgStyles + procStyles }} />
    </>
  );
}

createRoot(document.getElementById('root')).render(<App />);
